name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every third-party action is pinned by commit SHA, never by tag. A tag is mutable: whoever
# controls that repository can move it, and every workflow trusting the tag then runs new
# code. It is the same argument this project makes against `npx @latest` in a guard hook.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # No lockfile is committed (this package has no runtime dependencies), so `npm ci`
      # has nothing to install from.
      - run: npm install
      # The suite covers the vendored guard copy, and that copy is `bin/vibeward.mjs`.
      # Building it here is what makes CI exercise the real path rather than the
      # not-built-yet fallback a fresh clone takes.
      - run: npm run build:plugin
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  plugin:
    # The bundled CLI is not committed — `publish-plugin.yml` builds it on a tag and pushes it
    # to the `plugin` branch. The skills and the manifest are, so this job checks two things:
    # that the build still works, on the pull request rather than on release day, and that
    # what is committed is what the build produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install
      - run: npm run build:plugin
      - name: The plugin build produced what the hooks expect to run
        run: |
          test -s bin/vibeward.mjs
          test -x bin/vibeward
          # Every skill in the set, not just the first: the plugin and the `npx skills add`
          # catalogue ship all of them, so a spec that stopped being written would go unnoticed.
          test -s skills/vibeward/SKILL.md
          test -s skills/install-vibeward-guardrails/SKILL.md
          test -s skills/ci-security-scanning-with-vibeward/SKILL.md
          node bin/vibeward.mjs --version
      - name: The committed skills and manifest are what the build generates
        run: |
          # `npx skills add JSiapoDEV/vibeward` installs skills/ from this branch, so a template
          # or a version changed without `npm run build:plugin` would ship stale instructions.
          git status --porcelain -- skills .claude-plugin/plugin.json
          test -z "$(git status --porcelain -- skills .claude-plugin/plugin.json)"
